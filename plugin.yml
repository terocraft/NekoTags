name: NekoTags
main: com.github.SoyDary.NekoTags.NekoTags
depend: [PlaceholderAPI]
softdepend: [Essentials]
author: Dariela
version: 1.5.1
api-version: 1.17
commands:
   NekoTags:
      description: Comando principal para las tags!
      usage: /<command>
      aliases: [tags, etiquetas]
permissions:
   nekotags.admin:
      description: Permite administrar las etiquetas (reload, give, remove, list)
      default: op
   nekotags.tag.*:
      description: Permite usar cualquier etiqueta
      default: op
